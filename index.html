<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="logo"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5M9 13h7M9 17h5"/></svg>
    <span>PDF Editor</span>
  </div>

  <div class="group">
    <button id="btnOpen" class="btn" title="Open a PDF (Ctrl+O)">Open</button>
    <button id="btnMerge" class="btn" title="Append pages from other PDFs">Add PDF</button>
    <button id="btnBlank" class="btn" title="Insert a blank page after the current page">Blank page</button>
  </div>

  <div class="group tools" id="tools">
    <button class="tool active" data-tool="select" title="Select &amp; move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>Select</span></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg><span>Text</span></button>
    <button class="tool" data-tool="draw" title="Draw (D)"><svg viewBox="0 0 24 24"><path d="M3 17c3-4 5-9 8-9s1 8 4 8 4-4 6-6"/></svg><span>Draw</span></button>
    <button class="tool" data-tool="highlight" title="Highlight (H)"><svg viewBox="0 0 24 24"><path d="M9 11l-5 5v3h3l5-5M9 11l4-4 4 4-4 4zM14 20h7"/></svg><span>Highlight</span></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>Box</span></button>
    <button class="tool" data-tool="whiteout" title="White-out (W)"><svg viewBox="0 0 24 24"><path d="M7 20h13M4 15l9-9 6 6-7 7H8z"/></svg><span>White-out</span></button>
    <button class="tool" data-tool="image" title="Image (I)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg><span>Image</span></button>
    <button class="tool" data-tool="sign" title="Signature (S)"><svg viewBox="0 0 24 24"><path d="M3 16c2 0 3-6 5-6s1 5 3 5 2-3 4-3 2 2 6 2M3 21h18"/></svg><span>Sign</span></button>
  </div>

  <div class="group style">
    <label class="field" title="Color"><input type="color" id="color" value="#e11d48"></label>
    <label class="field" id="sizeField"><span id="sizeLabel">Size</span><input type="number" id="size" min="1" max="144" value="3"></label>
  </div>

  <div class="group">
    <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 000 10h3"/></svg></button>
    <button id="btnDelete" class="icon-btn" title="Delete selected (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>

  <div class="group zoom">
    <button id="btnZoomOut" class="icon-btn" title="Zoom out (-)">&minus;</button>
    <button id="btnFit" class="zoom-label" title="Fit width"><span id="zoomLabel">125%</span></button>
    <button id="btnZoomIn" class="icon-btn" title="Zoom in (+)">+</button>
  </div>

  <div class="spacer"></div>
  <button id="btnDownload" class="btn primary" title="Download edited PDF (Ctrl+S)">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download
  </button>
</header>

<div class="main">
  <aside class="sidebar"><div id="thumbs"></div></aside>
  <section class="viewer" id="viewer">
    <div class="empty" id="empty">
      <div class="dropcard">
        <h1>Edit a PDF in your browser</h1>
        <p>Add text, drawings, highlights, images and signatures. Reorder, rotate, delete and merge pages. Files never leave your device.</p>
        <button class="btn primary big" id="btnOpen2">Choose a PDF</button>
        <button class="btn link" id="btnBlank2">or start with a blank page</button>
        <p class="muted">You can also drop a PDF anywhere on this page.</p>
      </div>
    </div>
    <div class="pages" id="pages"></div>
  </section>
</div>

<footer class="statusbar"><span id="hint"></span><span id="pageInfo"></span></footer>

<input type="file" id="filePdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileMerge" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileImage" accept="image/*" hidden>

<div class="modal" id="sigModal" hidden>
  <div class="modal-card" role="dialog" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Draw your signature</h2>
    <canvas id="sigCanvas"></canvas>
    <div class="modal-actions">
      <button class="btn link" id="sigClear">Clear</button>
      <div class="spacer"></div>
      <button class="btn" id="sigCancel">Cancel</button>
      <button class="btn primary" id="sigOk">Add signature</button>
    </div>
  </div>
</div>

<div class="dropmask" id="dropmask" hidden><div>Drop PDF to open</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
